name: Build Edirear Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          # Automatically find and enter the project folder if nested
          if [ ! -f "settings.gradle" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle" -exec dirname {} \;)
            if [ -n "$SUBDIR" ]; then
              cd "$SUBDIR"
            fi
          fi

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # Accept Android licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

          # Download and run Gradle 8.2
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q -o gradle-8.2-bin.zip
          chmod +x ./gradle-8.2/bin/gradle

          ./gradle-8.2/bin/gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edirear-app-debug.apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          retention-days: 14
