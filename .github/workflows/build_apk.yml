name: Build Edirear Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          # If files are inside a subfolder, move into it
          if [ ! -f "settings.gradle" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle" -exec dirname {} \;)
            if [ -n "$SUBDIR" ]; then
              echo "Entering $SUBDIR"
              cd "$SUBDIR"
            fi
          fi

          # Link Android SDK
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # Download Gradle 8.2 and give it execution permission
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q -o gradle-8.2-bin.zip
          chmod +x ./gradle-8.2/bin/gradle

          # Build APK
          ./gradle-8.2/bin/gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edirear-app-debug.apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          retention-days: 14
